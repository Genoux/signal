<!-- @dsCard group="Status" height=48 width=960 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<title>StatusBarItem</title>
<style>

</style>
</head>
<body>
<footer class="sg-statusbar" style="border-top: 0">
  <span style="color: var(--sg-text-primary)">overview</span>
  <span class="sg-status-item sg-status-item--wait"><svg class="sg-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1 11 6 6 11 1 6Z" fill="currentColor"/></svg>2 waiting</span>
  <span class="sg-status-item"><svg class="sg-icon sg-tone-run" viewBox="0 0 12 12" aria-hidden="true"><g fill="currentColor"><circle cx="4" cy="2.5" r="1"/><circle cx="8" cy="2.5" r="1"/><circle cx="4" cy="6" r="1"/><circle cx="8" cy="6" r="1"/><circle cx="4" cy="9.5" r="1"/><circle cx="8" cy="9.5" r="1"/></g></svg>4 running</span>
  <span class="sg-status-item sg-status-item--done"><svg class="sg-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 6.4 4.8 9 9.8 3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>2 done</span>
  <span class="sg-status-item sg-status-item--err"><svg class="sg-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3 3 9" stroke="currentColor" stroke-width="1.5"/></svg>1 failed</span>
  <span class="sg-statusbar__keys">drag pan · scroll zoom · Tab next waiting · Enter open · f fit</span>
  <span class="sg-status-host">macbook</span>
  <span class="sg-status-host">arch-workstation 14 ms</span>
</footer>
</body>
</html>
