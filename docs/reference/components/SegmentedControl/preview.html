<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<title>SegmentedControl</title>
<style>
.stage { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sg-space-10); padding: var(--sg-space-16); }
</style>
</head>
<body>
<div class="stage">
  <div class="sg-segmented" role="group" aria-label="Zoom">
    <button type="button" id="zout" aria-label="Zoom out"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <output id="zval" aria-live="polite">2×</output>
    <button type="button" id="zin" aria-label="Zoom in"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7M6 2.5v7" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button type="button" id="zfit">fit</button>
  </div>
</div>
<script>
var LEVELS = [1, 2, 3, 4, 5, 6, 8], zi = 1;
function zoom(i) { zi = Math.max(0, Math.min(LEVELS.length - 1, i)); document.getElementById('zval').textContent = LEVELS[zi] + '\u00d7'; }
document.getElementById('zout').addEventListener('click', function () { zoom(zi - 1); });
document.getElementById('zin').addEventListener('click', function () { zoom(zi + 1); });
document.getElementById('zfit').addEventListener('click', function () { zoom(1); });
</script>
</body>
</html>
